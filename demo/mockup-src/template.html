<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a working app inside a device frame (phone for members, browser for vendors/admins), with a guide rail alongside that explains each screen. */
:root {
  --ground: #e7eee6; --ground-2: #d9e4d8;
  --surface: #ffffff; --surface-2: #f3f6f2; --surface-3: #e8eee7;
  --ink: #13241b; --ink-2: #43554b; --muted: #728379; --line: #d8e2d9;
  --leaf: #1c7a4b; --leaf-2: #13603a; --leaf-ink: #ffffff; --leaf-soft: #dcf0e3;
  --citrus: #e2702a; --citrus-soft: #fde7d6;
  --sky: #2876bb; --sky-soft: #dbeaf7;
  --sponsor-bg: #ffefbf; --sponsor-ink: #744a00;
  --warn: #9a5800; --warn-bg: #ffefd2; --bad: #b0233a; --bad-bg: #fbe1e5;
  --info: #1d5f9f; --info-bg: #dfeafa; --neutral: #4b585e; --neutral-bg: #e9edee;
  --bezel: #0b100d; --scrim: rgba(10, 22, 15, .42);
  --shadow: 0 40px 80px -30px rgba(19, 50, 32, .45), 0 12px 24px -12px rgba(19, 50, 32, .25);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0b1410; --ground-2: #102019;
  --surface: #14201a; --surface-2: #1a2a22; --surface-3: #22352b;
  --ink: #e6f0ea; --ink-2: #b6c6bc; --muted: #8b9c92; --line: #2a3e33;
  --leaf: #46c085; --leaf-2: #6fd6a2; --leaf-ink: #06140d; --leaf-soft: #173a29;
  --citrus: #f39a5c; --citrus-soft: #3d2615;
  --sky: #6aaee8; --sky-soft: #15304a;
  --sponsor-bg: #3e3008; --sponsor-ink: #ffd877;
  --warn: #ffc56b; --warn-bg: #3b2a0c; --bad: #ff8d9f; --bad-bg: #3d1820;
  --info: #8cc0f5; --info-bg: #142c48; --neutral: #b9c4c8; --neutral-bg: #26322f;
  --bezel: #030605; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 40px 80px -30px rgba(0, 0, 0, .8), 0 12px 24px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ground: #0b1410; --ground-2: #102019;
  --surface: #14201a; --surface-2: #1a2a22; --surface-3: #22352b;
  --ink: #e6f0ea; --ink-2: #b6c6bc; --muted: #8b9c92; --line: #2a3e33;
  --leaf: #46c085; --leaf-2: #6fd6a2; --leaf-ink: #06140d; --leaf-soft: #173a29;
  --citrus: #f39a5c; --citrus-soft: #3d2615;
  --sky: #6aaee8; --sky-soft: #15304a;
  --sponsor-bg: #3e3008; --sponsor-ink: #ffd877;
  --warn: #ffc56b; --warn-bg: #3b2a0c; --bad: #ff8d9f; --bad-bg: #3d1820;
  --info: #8cc0f5; --info-bg: #142c48; --neutral: #b9c4c8; --neutral-bg: #26322f;
  --bezel: #030605; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 40px 80px -30px rgba(0, 0, 0, .8), 0 12px 24px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  background-image: radial-gradient(1200px 600px at 85% -10%, var(--leaf-soft), transparent 60%), radial-gradient(900px 500px at -10% 110%, var(--citrus-soft), transparent 60%);
  background-attachment: fixed;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.sm { width: 14px; height: 14px; } .ico.lg { width: 22px; height: 22px; } .ico.xl { width: 30px; height: 30px; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- page chrome ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--ground) 82%, transparent); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--ground); }
.topbar-in { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.mark { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark-logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--leaf); color: var(--leaf-ink); }
.mark h1 { font-size: 18px; font-weight: 800; }
.mark p { margin: 0; font-size: 12px; color: var(--muted); }
.seg { position: relative; display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--leaf-ink); }
.seg .thumb { position: absolute; z-index: 0; top: 4px; bottom: 4px; border-radius: 999px; background: var(--leaf); transition: left .45s cubic-bezier(.2,.9,.2,1.15), width .45s cubic-bezier(.2,.9,.2,1.15); box-shadow: 0 4px 12px -4px var(--leaf); }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: 13.5px; border: 1px solid transparent; transition: transform .15s, background .2s, box-shadow .2s, opacity .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--leaf); color: var(--leaf-ink); box-shadow: 0 6px 16px -8px var(--leaf); }
.btn-primary:hover { background: var(--leaf-2); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-citrus { background: var(--citrus); color: #fff; }
.btn-danger { background: var(--bad); color: var(--surface); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.block { width: 100%; padding: 13px; }

.stage-wrap {
  max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start;
  padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { display: flex; justify-content: center; min-width: 0; }

/* ---------- device frame ---------- */
.frame {
  position: relative; background: var(--bezel); box-shadow: var(--shadow); overflow: hidden;
  transition: width .7s cubic-bezier(.65,0,.25,1), height .7s cubic-bezier(.65,0,.25,1), border-radius .7s, padding .7s;
}
.frame.phone { width: 398px; height: 820px; border-radius: 54px; padding: 11px; }
.frame.browser { width: min(1000px, 100%); height: 760px; border-radius: 16px; padding: 0; }
.device { position: relative; height: 100%; background: var(--surface-2); overflow: hidden; display: flex; flex-direction: column; transition: border-radius .7s; }
.frame.phone .device { border-radius: 44px; }
.frame.browser .device { border-radius: 16px; }
.statusbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 6px; font-weight: 700; font-size: 14px; flex: none; background: var(--surface); }
.statusbar .notch { width: 110px; height: 30px; background: var(--bezel); border-radius: 20px; position: absolute; left: 50%; top: 9px; transform: translateX(-50%); }
.statusbar .sig { display: flex; gap: 5px; align-items: center; }
.browserbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface-3); border-bottom: 1px solid var(--line); flex: none; }
.dots { display: flex; gap: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.dots i:nth-child(1) { background: #f26457; } .dots i:nth-child(2) { background: #f4bc2f; } .dots i:nth-child(3) { background: #33c14a; }
.url { flex: 1; min-width: 0; background: var(--surface); border-radius: 8px; padding: 6px 12px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.frame.phone .browserbar, .frame.browser .statusbar { display: none; }
.screen { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; overscroll-behavior: contain; }
.screen::-webkit-scrollbar { width: 0; }
.frame.browser .screen::-webkit-scrollbar { width: 8px; }
.frame.browser .screen::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px 18px; }
.frame.browser .tabbar { display: none; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 6px 0; position: relative; }
.tabbar button[aria-current="page"] { color: var(--leaf); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 26px; height: 3px; border-radius: 3px; background: var(--leaf); animation: pop .4s; }
.tabbar .newdot { position: absolute; top: 2px; right: calc(50% - 18px); background: var(--citrus); color: #fff; font-size: 9px; padding: 0 5px; border-radius: 99px; line-height: 15px; }

/* ---------- view animations ---------- */
.view { padding: 16px 16px 28px; display: grid; gap: 16px; }
.view.fwd { animation: inRight .45s cubic-bezier(.2,.8,.2,1); }
.view.back { animation: inLeft .45s cubic-bezier(.2,.8,.2,1); }
.view.fade { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1); }
.rise { animation: fadeUp .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes inRight { from { opacity: 0; transform: translateX(36px); } }
@keyframes inLeft { from { opacity: 0; transform: translateX(-36px); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes sheen { 0% { transform: translateX(-120%) skewX(-18deg); } 60%, 100% { transform: translateX(260%) skewX(-18deg); } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--leaf) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
@keyframes ring { from { stroke-dashoffset: var(--from); } to { stroke-dashoffset: var(--to); } }
@keyframes shake { 10%, 90% { transform: translateX(-1px); } 30%, 70% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

/* ---------- shared app pieces ---------- */
.apphead { display: flex; align-items: center; gap: 10px; }
.apphead h2 { font-size: 24px; font-weight: 800; }
.apphead .sub { color: var(--muted); font-size: 12.5px; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); flex: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.pill.sponsor { background: var(--sponsor-bg); color: var(--sponsor-ink); }
.pill.aff { background: var(--surface-3); color: var(--ink-2); }
.pill.reg { background: var(--info-bg); color: var(--info); }
.pill.new { background: var(--citrus); color: #fff; animation: pop .5s; }
.st-draft { background: var(--neutral-bg); color: var(--neutral); }
.st-pending { background: var(--warn-bg); color: var(--warn); }
.st-approved { background: var(--info-bg); color: var(--info); }
.st-published { background: var(--leaf-soft); color: var(--leaf); }
.st-rejected { background: var(--bad-bg); color: var(--bad); }
.st-expired { background: var(--neutral-bg); color: var(--neutral); }
.muted { color: var(--muted); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.note { display: flex; gap: 8px; font-size: 12px; color: var(--ink-2); background: var(--surface-3); border-radius: 14px; padding: 10px 12px; }
.note.sponsor { background: var(--sponsor-bg); color: var(--sponsor-ink); }
.note.reg { background: var(--info-bg); color: var(--info); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.secthead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.secthead h3 { font-size: 16px; font-weight: 700; }
.link { border: 0; background: none; color: var(--leaf); font-weight: 600; font-size: 13px; padding: 0; }

/* art tiles */
.art { position: relative; overflow: hidden; display: grid; place-items: center; color: rgba(255,255,255,.95); isolation: isolate; }
.art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 25% 20%, rgba(255,255,255,.35), transparent 45%), radial-gradient(circle at 85% 90%, rgba(0,0,0,.18), transparent 50%); z-index: -1; }
.art svg.ico { filter: drop-shadow(0 4px 10px rgba(0,0,0,.18)); }
.art .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); z-index: -1; }
.g-telehealth { background: linear-gradient(135deg, #2f8fd8, #1a4f9a); }
.g-products { background: linear-gradient(135deg, #67c25f, #217a45); }
.g-weight { background: linear-gradient(135deg, #f6a54d, #d4572a); }
.g-fitness { background: linear-gradient(135deg, #f0657f, #a8326b); }
.g-books { background: linear-gradient(135deg, #9a7be6, #5a3fb0); }
.g-providers { background: linear-gradient(135deg, #2fb5a5, #136f72); }
.g-events { background: linear-gradient(135deg, #f2c84b, #cc7a12); }

/* ---------- member: home ---------- */
.hello h2 { font-size: 25px; }
.ringcard { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; }
.ringwrap { position: relative; width: 132px; height: 132px; }
.ringwrap svg { width: 132px; height: 132px; transform: rotate(-90deg); }
.ringwrap .track { stroke: var(--surface-3); }
.ringwrap .val { stroke: var(--citrus); stroke-linecap: round; animation: ring 1.3s cubic-bezier(.2,.8,.2,1) both; }
.ringwrap .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ringwrap .mid b { font-family: var(--f-display); font-size: 27px; display: block; line-height: 1; }
.macro { display: grid; gap: 4px; }
.macro .bar { height: 7px; border-radius: 7px; background: var(--surface-3); overflow: hidden; }
.macro .bar i { display: block; height: 100%; border-radius: 7px; transform-origin: left; animation: growX 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: .25s; }
.water { display: flex; gap: 6px; flex-wrap: wrap; }
.glass { width: 26px; height: 34px; border-radius: 6px 6px 9px 9px; border: 2px solid var(--sky); position: relative; overflow: hidden; background: none; padding: 0; }
.glass i { position: absolute; inset: auto 0 0; height: 0; background: var(--sky); transition: height .45s cubic-bezier(.2,.8,.2,1.2); }
.glass.full i { height: 100%; }
.coach { background: linear-gradient(135deg, var(--leaf), var(--leaf-2)); color: var(--leaf-ink); border: 0; position: relative; overflow: hidden; }
.coach::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent); animation: sheen 4.5s ease-in-out infinite; }
.coach .tag { display: inline-flex; gap: 5px; align-items: center; font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,.18); padding: 3px 8px; border-radius: 99px; }

/* meals */
.daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daystrip button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 7px 0; display: grid; gap: 1px; justify-items: center; font-size: 11px; color: var(--muted); }
.daystrip button b { font-size: 15px; color: var(--ink); font-family: var(--f-display); }
.daystrip button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.daystrip button[aria-pressed="true"] b { color: var(--surface); }
.meal { display: grid; gap: 8px; }
.food { display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; }
.food .art { width: 42px; height: 42px; border-radius: 12px; }
.food .art .ico { width: 20px; height: 20px; }
.addrow { border: 1.5px dashed var(--line); border-radius: 14px; padding: 10px; background: none; color: var(--leaf); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }

/* progress */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gridl { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .line { fill: none; stroke: var(--leaf); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; animation: draw 1.6s cubic-bezier(.4,0,.2,1) both; }
.chart .area { fill: var(--leaf); opacity: .12; animation: fadeUp 1s .6s both; }
.chart .pt circle { fill: var(--surface); stroke: var(--leaf); stroke-width: 2.5; }
.chart .pt .hit { fill: transparent; stroke: none; }
.chart .pt .tip { opacity: 0; transition: opacity .15s; pointer-events: none; }
.chart .pt .tip rect { fill: var(--ink); } .chart .pt .tip text { fill: var(--surface); font-size: 10.5px; font-weight: 700; font-family: var(--f-body); }
.chart .pt:hover .tip, .chart .pt:focus .tip { opacity: 1; }
.chart .pt:hover circle.dot, .chart .pt:focus circle.dot { r: 6; }
.chart .bar { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
.chart .bar.f-citrus { fill: var(--citrus); } .chart .bar.f-leaf { fill: var(--leaf); } .chart .bar.f-muted { fill: var(--surface-3); }
.chart .goal { stroke: var(--ink-2); stroke-dasharray: 4 4; stroke-width: 1.2; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.stat b { font-family: var(--f-display); font-size: 21px; display: block; line-height: 1.1; }
.goalbar { height: 10px; border-radius: 10px; background: var(--surface-3); overflow: hidden; }
.goalbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), var(--leaf-2)); border-radius: 10px; transform-origin: left; animation: growX 1.2s .3s cubic-bezier(.2,.8,.2,1) both; }

/* market */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 12px; }
.search input { border: 0; outline: 0; background: none; padding: 12px 0; flex: 1; min-width: 0; }
.featured { display: grid; grid-auto-flow: column; grid-auto-columns: 86%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
.featured::-webkit-scrollbar { display: none; }
.partner { scroll-snap-align: start; border-radius: 22px; padding: 16px; color: #fff; position: relative; overflow: hidden; text-align: left; border: 0; display: grid; gap: 10px; min-height: 178px; isolation: isolate; }
.partner::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); animation: sheen 5s ease-in-out infinite; z-index: -1; }
.partner.tmd { background: radial-gradient(circle at 90% 10%, #4ca8f0 0%, transparent 45%), linear-gradient(145deg, #1a4f9a, #0e2f61); }
.partner.xim { background: radial-gradient(circle at 90% 10%, #8fe07a 0%, transparent 45%), linear-gradient(145deg, #2c8a4f, #10492a); }
.partner .plogo { width: 46px; height: 46px; border-radius: 14px; background: rgba(255,255,255,.95); display: grid; place-items: center; animation: floaty 4s ease-in-out infinite; }
.partner h3 { font-size: 20px; }
.partner p { margin: 0; font-size: 12.5px; opacity: .92; }
.partner .disc { font-size: 10.5px; opacity: .78; }
.partner .pill.sponsor { box-shadow: 0 2px 8px rgba(0,0,0,.2); }
